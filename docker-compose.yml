services:
  shadow-postgres:
    image: postgres:16-alpine
    profiles: ['shadow']
    environment:
      POSTGRES_DB: nfc_ecard_shadow
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: shadow
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shadow -d nfc_ecard_shadow']
      interval: 5s
      timeout: 3s
      retries: 10
